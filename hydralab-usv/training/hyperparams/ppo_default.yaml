# HydraLab-USV PPO default hyperparameters
# No curriculum — trains on full disturbances from step 0.
# Suitable for quick experiments and ablations.

total_timesteps: 50000000
n_steps: 256
batch_size: 4096
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
normalize_advantage: true
seed: 42

log_dir: "logs/ppo_default"
checkpoint_dir: "checkpoints/ppo_default"
checkpoint_freq: 500000
log_interval: 10
eval_freq: 1000000
n_eval_episodes: 50

policy:
  net_arch: [256, 256]
  activation: "tanh"
  shared_features: true
  use_lstm: false

curriculum:
  enabled: false
  schedule: "linear"
  warmup_steps: 500000
  full_steps: 5000000
  initial_disturbance_scale: 1.0
  final_disturbance_scale: 1.0
  initial_dr_scale: 1.0
  final_dr_scale: 1.0
