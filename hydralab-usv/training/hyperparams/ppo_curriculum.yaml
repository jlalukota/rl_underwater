# HydraLab-USV PPO with disturbance curriculum
#
# Curriculum schedule:
#   Phase A (0 – 500k steps):   disturbance_scale = 0.05  (near-calm water)
#   Phase B (500k – 5M steps):  cosine ramp to full disturbances
#   Phase C (5M+ steps):        disturbance_scale = 1.0   (full storm)
#
# Domain randomization follows a slower schedule:
#   Phase A-B:   DR disabled (policy learns on nominal vehicle model)
#   Phase C:     DR ramps to full over remaining training
#
# This config targets 50M steps on 1024 parallel envs (~286k SPS on CPU,
# ~2M+ SPS on GPU).  Adjust total_timesteps for shorter/longer runs.

total_timesteps: 50000000
n_steps: 256
batch_size: 4096
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
normalize_advantage: true
seed: 42

log_dir: "logs/ppo_curriculum"
checkpoint_dir: "checkpoints/ppo_curriculum"
checkpoint_freq: 500000
log_interval: 10
eval_freq: 1000000
n_eval_episodes: 50

policy:
  net_arch: [256, 256]
  activation: "tanh"
  shared_features: true
  use_lstm: false

curriculum:
  enabled: true
  schedule: "cosine"
  warmup_steps: 500000
  full_steps: 5000000
  initial_disturbance_scale: 0.05
  final_disturbance_scale: 1.0
  initial_dr_scale: 0.0
  final_dr_scale: 1.0
  step_boundaries: [0.25, 0.5, 0.75]
  step_values: [0.25, 0.5, 0.75, 1.0]
